name: Build release binaries

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
            packages: ""
            linker: ""
            linker_env: ""
            zigbuild: false
          - target: x86_64-unknown-linux-musl
            archive: tar.gz
            packages: musl-tools
            linker: musl-gcc
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
            zigbuild: false
          - target: x86_64-pc-windows-gnu
            archive: zip
            packages: gcc-mingw-w64-x86-64 zip
            linker: x86_64-w64-mingw32-gcc
            linker_env: CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER
            zigbuild: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Add Rust target
        run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.local/bin
            target/${{ matrix.target }}
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.target }}-

      - name: Install cross packages
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ${{ matrix.packages }}

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        run: |
          set -eu
          python3 -m pip install --user --disable-pip-version-check ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --locked

      - name: Configure linker
        if: matrix.linker != ''
        run: echo "$LINKER_ENV=$LINKER" >> "$GITHUB_ENV"
        env:
          LINKER_ENV: ${{ matrix.linker_env }}
          LINKER: ${{ matrix.linker }}

      - name: Build
        run: |
          set -eu
          if [ "$ZIGBUILD" = "true" ]; then
            cargo zigbuild --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
          file target/"$TARGET"/release/rtl9617c-factory*
        env:
          TARGET: ${{ matrix.target }}
          ZIGBUILD: ${{ matrix.zigbuild }}

      - name: Package
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git rev-parse --short=12 HEAD)"
          fi
          bin="target/$TARGET/release/rtl9617c-factory"
          if [ -f "$bin.exe" ]; then
            bin="$bin.exe"
          fi
          name="rtl9617c-factory-$version-$TARGET"
          mkdir -p "dist/$name"
          cp "$bin" README.md "dist/$name/"
          ( cd "dist/$name" && sha256sum ./* > sha256sums.txt )
          if [ "$ARCHIVE" = "zip" ]; then
            ( cd dist && zip -qr "$name.zip" "$name" )
          else
            ( cd dist && tar -czf "$name.tar.gz" "$name" )
          fi
          rm -rf "dist/$name"
          ls -l dist
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          cd dist
          sha256sum ./* > SHA256SUMS
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          gh release upload "$TAG" ./* --repo "$REPO" --clobber
